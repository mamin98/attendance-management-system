services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: attendance-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - attendance-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=attendance;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: AttendanceSystem
      Jwt__Audience: AttendanceSystemUsers
      Jwt__ExpireMinutes: "120"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: "587"
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_USERNAME}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    ports:
      - "8080:8080"
    volumes:
      - attendance-uploads:/app/Uploads
      - attendance-logs:/app/Logs
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - attendance-network
    restart: unless-stopped

volumes:
  sqlserver-data:
  attendance-uploads:
  attendance-logs:

networks:
  attendance-network:
    driver: bridge